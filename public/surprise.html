<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>المفاجأة - العاب لولي</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,#4f233d 0,#160c15 42%,#050407 78%);color:#fff;font-family:Arial,sans-serif}.scene{text-align:center;animation:reveal 900ms ease-out both}.step{color:#c4a8b6;font-size:14px;margin-bottom:22px}.word{font-size:clamp(38px,10vw,120px);font-weight:900;letter-spacing:2px;color:#ff9fca;text-shadow:0 0 25px rgba(255,159,202,.5),0 0 70px rgba(255,92,164,.2);animation:pulse 1.5s ease-in-out infinite}.sub{margin-top:18px;color:#c4a8b6;font-size:clamp(14px,2vw,22px)}@keyframes reveal{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}@keyframes pulse{50%{transform:scale(1.03);text-shadow:0 0 35px rgba(255,159,202,.65),0 0 90px rgba(255,92,164,.3)}}
</style>
</head>
<body>
<main class="scene"><div class="step">الخطوة 4 من 4</div><div class="word">زوووووووووووووووط لولي</div><div class="sub">انتهت اللعبة</div></main>
</body>
</html>
