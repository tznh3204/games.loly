<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الاتصال بالبث - العاب لولي</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#4a263a,#130d13 45%,#050407);color:#fff;font-family:Arial,sans-serif}.wrap{width:620px;max-width:92%}.brand{text-align:center;font-size:42px;font-weight:900}.pink{color:#ff9fca}.step{text-align:center;color:#c4a8b6;margin-top:8px}.card{margin-top:24px;background:#171016;border:1px solid #4a3041;border-radius:18px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.4)}h1{font-size:24px;margin:0 0 18px}label{display:block;color:#c4a8b6;margin-bottom:8px}input{width:100%;padding:14px;background:#0d090d;border:1px solid #58364a;border-radius:9px;color:#fff;font-size:16px;direction:ltr}button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:9px;background:#ff9fca;color:#160b12;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.status{margin-top:15px;min-height:24px;color:#ff9fca;line-height:1.6}.back{display:block;text-align:center;color:#b9a1b0;text-decoration:none;margin-top:18px}
</style>
</head>
<body><main class="wrap"><div class="brand">العاب <span class="pink">لولي</span></div><div class="step">الخطوة 1 من 4</div><section class="card"><h1>الاتصال بالبث</h1><label for="username">يوزر TikTok</label><input id="username" placeholder="@username" autocomplete="off"><button id="connect" onclick="connectLive()">اتصال بالبث</button><div id="status" class="status"></div></section><a class="back" href="/">العودة للرئيسية</a></main>
<script>
async function connectLive(){const username=document.getElementById("username").value.trim().replace(/^@/,"");const status=document.getElementById("status");const button=document.getElementById("connect");if(!username){status.textContent="اكتب يوزر TikTok.";return}button.disabled=true;status.textContent="جاري الاتصال بالبث...";try{const response=await fetch("/api/live/connect",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})});const data=await response.json();if(!data.success){status.textContent=data.message||"تعذر الاتصال بالبث.";return}window.location.href="/start"}catch(error){status.textContent="حدث خطأ في الاتصال بالسيرفر."}finally{button.disabled=false}}
document.getElementById("username").addEventListener("keydown",event=>{if(event.key==="Enter")connectLive()});
</script></body></html>
