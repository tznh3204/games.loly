<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الأسئلة - العاب لولي</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#4a263a,#130d13 50%,#050407);color:#fff;font-family:Arial,sans-serif}.wrap{width:820px;max-width:92%;margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:36px;font-weight:900}.pink{color:#ff9fca}.step{color:#c4a8b6;font-size:14px}.card{margin-top:22px;background:#171016;border:1px solid #4a3041;border-radius:18px;padding:26px;box-shadow:0 25px 80px rgba(0,0,0,.4)}.number{text-align:center;color:#b9a1b0}.question{font-size:29px;font-weight:800;text-align:center;line-height:1.65;margin:20px 0}.timer{font-size:52px;font-weight:900;color:#ff9fca;text-align:center}.timer.danger{color:#ffbf3c}.state{text-align:center;color:#b9a1b0;line-height:1.7;min-height:29px;margin-top:10px}.result{display:none;margin-top:18px;padding:18px;text-align:center;background:#0d090d;border:1px solid #4a3041;border-radius:14px}.result img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #ff9fca}.result-name{font-size:21px;font-weight:800;margin-top:9px}.result-xp{color:#ff9fca;font-weight:800;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{width:100%;padding:14px;border:0;border-radius:9px;background:#ff9fca;color:#160b12;font-size:16px;font-weight:800;cursor:pointer}button.secondary{background:#21151e;color:#fff;border:1px solid #58364a}button:disabled{opacity:.5}.finish{text-align:center;padding:35px 10px}.finish h1{font-size:30px}.final img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #ff9fca}.final-name{font-size:25px;font-weight:800;margin-top:12px}.final-score{color:#ff9fca;font-size:19px;font-weight:800;margin-top:8px}@media(max-width:600px){.question{font-size:22px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap"><header class="top"><div class="brand">العاب <span class="pink">لولي</span></div><div class="step">الخطوة 3 من 4</div></header><section id="questionCard" class="card"><div id="number" class="number"></div><div id="question" class="question"></div><div id="timer" class="timer">0</div><div id="state" class="state"></div><div id="result" class="result"><img id="winnerAvatar" alt=""><div id="winnerName" class="result-name"></div><div id="winnerXp" class="result-xp"></div></div><div class="actions"><button id="next" onclick="nextQuestion()" style="display:none">السؤال التالي</button><button class="secondary" onclick="resetGame()">إعادة ضبط</button></div></section></main>
<script>
function safeImage(url){return typeof url==="string"&&/^https?:\/\//i.test(url)?url:""}
function showWinner(w){const box=document.getElementById("result");const avatar=document.getElementById("winnerAvatar");const source=safeImage(w.avatar);avatar.src=source;avatar.style.display=source?"inline-block":"none";document.getElementById("winnerName").textContent=w.nickname||w.username||"مشارك";document.getElementById("winnerXp").textContent=`+${w.earnedXp||0} XP | المجموع ${w.totalXp||0} XP`;box.style.display="block"}
function render(game){if(game.phase==="waiting"){location.href="/start";return}if(game.phase==="finished"){location.href="/winner";return}document.getElementById("number").textContent=`السؤال ${game.currentIndex+1} من ${game.totalQuestions}`;document.getElementById("question").textContent=game.currentQuestion;document.getElementById("timer").textContent=game.remainingSeconds;document.getElementById("timer").className="timer"+(game.remainingSeconds<=5&&game.phase==="question"?" danger":"");const state=document.getElementById("state");const next=document.getElementById("next");if(game.phase==="question"){state.textContent="أرسل الإجابة في تعليقات البث.";next.style.display="none";document.getElementById("result").style.display="none"}else if(game.phase==="answered"){state.textContent=game.resultMessage||"إجابة صحيحة.";next.style.display="block";if(game.winner)showWinner(game.winner)}else{state.textContent=game.resultMessage||"انتهى الوقت.";next.style.display="block";document.getElementById("result").style.display="none"}}
async function poll(){try{const response=await fetch("/api/game/state",{cache:"no-store"});const data=await response.json();if(data.success)render(data.game)}catch(error){}}
async function nextQuestion(){const button=document.getElementById("next");button.disabled=true;const response=await fetch("/api/game/next",{method:"POST"});const data=await response.json();if(!data.success){document.getElementById("state").textContent=data.message||"لا يمكن الانتقال الآن.";button.disabled=false;return}render(data.game);button.disabled=false}
async function resetGame(){await fetch("/api/game/reset",{method:"POST"});location.href="/connect"}
poll();setInterval(poll,500);
</script></body></html>
