<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الفائز - العاب لولي</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#4a263a,#130d13 48%,#050407);color:#fff;font-family:Arial,sans-serif}.wrap{width:650px;max-width:92%;text-align:center}.brand{font-size:42px;font-weight:900}.pink{color:#ff9fca}.step{color:#c4a8b6;margin-top:8px}.card{margin-top:24px;background:#171016;border:1px solid #4a3041;border-radius:20px;padding:32px 24px;box-shadow:0 25px 80px rgba(0,0,0,.45)}h1{font-size:32px;margin:0 0 22px}.avatar{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid #ff9fca;background:#0d090d}.name{font-size:28px;font-weight:900;margin-top:16px}.message{color:#c4a8b6;font-size:18px;margin-top:10px}.score{color:#ff9fca;font-size:24px;font-weight:900;margin-top:12px}button{width:100%;padding:15px;margin-top:26px;border:0;border-radius:10px;background:#ff9fca;color:#160b12;font-size:17px;font-weight:900;cursor:pointer}.empty{color:#c4a8b6;line-height:1.8}
</style>
</head>
<body><main class="wrap"><div class="brand">العاب <span class="pink">لولي</span></div><div class="step">الخطوة 4 من 5</div><section class="card"><h1>الفائز باللعبة</h1><div id="winnerContent" style="display:none"><img id="avatar" class="avatar" alt=""><div id="name" class="name"></div><div class="message">يعرف البث اكثر</div><div id="score" class="score"></div><button onclick="location.href='/surprise'">الانتقال إلى المفاجأة</button></div><div id="empty" class="empty">جاري تحميل نتيجة اللعبة...</div></section></main>
<script>
function safeImage(url){return typeof url==="string"&&/^https?:\/\//i.test(url)?url:""}
async function loadWinner(){try{const response=await fetch("/api/game/state",{cache:"no-store"});const data=await response.json();const winner=data.game&&data.game.finalWinner;if(!winner){document.getElementById("empty").textContent="لا توجد نتيجة فوز حالية.";return}const avatar=document.getElementById("avatar");const source=safeImage(winner.avatar);avatar.src=source;avatar.style.display=source?"inline-block":"none";document.getElementById("name").textContent=winner.nickname||winner.username||"الفائز";document.getElementById("score").textContent=`مجموع النقاط: ${winner.totalXp||0} XP`;document.getElementById("empty").style.display="none";document.getElementById("winnerContent").style.display="block"}catch(error){document.getElementById("empty").textContent="تعذر تحميل نتيجة اللعبة."}}
loadWinner();
</script></body></html>
