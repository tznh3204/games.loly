<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>العاب لولي</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0%,#4a263a,#130d13 42%,#050407);color:#fff;font-family:Arial,sans-serif}.container{width:760px;max-width:92%;text-align:center}.logo{font-size:48px;font-weight:900;letter-spacing:2px}.green{color:#ff9fca}.subtitle{color:#c4a8b6;margin:12px 0 40px;font-size:17px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.option{padding:32px 18px;background:linear-gradient(145deg,#21151e,#0c090d);border:1px solid #58364a;border-radius:18px;color:#fff;text-decoration:none;transition:.2s;box-shadow:0 20px 60px rgba(0,0,0,.3)}.option:hover{transform:translateY(-5px);border-color:#ff9fca;box-shadow:0 18px 50px rgba(255,112,174,.16)}.icon{font-size:38px;margin-bottom:15px}.title{font-size:21px;font-weight:bold}.description{margin-top:10px;color:#ae91a2;font-size:14px}.footer{margin-top:30px;color:#745568;font-size:12px}@media(max-width:700px){.buttons{grid-template-columns:1fr}.logo{font-size:38px}}
</style>
</head>
<body>
<div class="container">
<div class="logo">العاب <span class="green">لولي</span></div>
<div class="subtitle">لعبة معرفة الستريمر والفاملي</div>
<div class="buttons">
<a class="option" href="/administration"><div class="icon">الإدارة</div><div class="title">Administration</div><div class="description">إدارة الأسئلة وإعداد اللعبة</div></a>
<a class="option" href="/streamer"><div class="icon">البث</div><div class="title">Streamer</div><div class="description">الاتصال بالبث وبدء اللعبة</div></a>
</div>
<div class="footer">TikTok | العاب لولي</div>
</div>
</body>
</html>
